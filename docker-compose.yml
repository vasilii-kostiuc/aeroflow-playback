services:
  # CLI / migrations container. Playback has no HTTP surface in this slice.
  aeroflow_playback_app:
    build:
      context: .
      dockerfile: _docker/Dockerfile
    container_name: aeroflow_playback_app
    volumes:
      - .:/var/www
    environment:
      APP_ENV: dev
      DATABASE_URL: postgresql://aeroflow:aeroflow@aeroflow_playback_postgres:5432/aeroflow_playback?serverVersion=16&charset=utf8
      # Shares aeroflow-core's RabbitMQ over the host (core publishes port 5672).
      MESSENGER_TRANSPORT_DSN: amqp://guest:guest@host.docker.internal:5672/%2f/announcement_playback
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      aeroflow_playback_postgres:
        condition: service_healthy
    networks:
      - aeroflow_playback

  # Consumes RequestAnnouncementPlayback and creates PlaybackJob rows.
  aeroflow_playback_worker:
    build:
      context: .
      dockerfile: _docker/Dockerfile
    container_name: aeroflow_playback_worker
    command: php bin/console messenger:consume async -vv
    volumes:
      - .:/var/www
    environment:
      APP_ENV: dev
      DATABASE_URL: postgresql://aeroflow:aeroflow@aeroflow_playback_postgres:5432/aeroflow_playback?serverVersion=16&charset=utf8
      MESSENGER_TRANSPORT_DSN: amqp://guest:guest@host.docker.internal:5672/%2f/announcement_playback
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      aeroflow_playback_postgres:
        condition: service_healthy
    networks:
      - aeroflow_playback

  aeroflow_playback_postgres:
    image: postgres:16-alpine
    container_name: aeroflow_playback_postgres
    environment:
      POSTGRES_DB: aeroflow_playback
      POSTGRES_USER: aeroflow
      POSTGRES_PASSWORD: aeroflow
    volumes:
      - playback_postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U aeroflow -d aeroflow_playback" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aeroflow_playback

networks:
  aeroflow_playback:
    driver: bridge

volumes:
  playback_postgres_data:
