framework:
    messenger:
        default_bus: command.bus

        buses:
            command.bus:
                # Order matters: the integration-event middleware wraps
                # doctrine_transaction so buffered outbound events are released only
                # after the transaction commits (and discarded on rollback).
                middleware:
                    - App\Playback\Infrastructure\Messenger\IntegrationEventTransactionMiddleware
                    - doctrine_transaction

        transports:
            # Inbound integration commands from aeroflow-core over RabbitMQ.
            # The custom serializer rebuilds the message from the JSON body, so this
            # service stays coupled to the contract, not to Core's PHP classes.
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                serializer: App\Playback\Infrastructure\Messaging\AnnouncementPlaybackSerializer
                retry_strategy:
                    max_retries: 3
                    delay: 1000
            # Outbound integration events back to aeroflow-core over RabbitMQ.
            # Contract JSON; core discriminates by the `event` field in the body,
            # not by this service's PHP class names.
            playback_events:
                dsn: '%env(MESSENGER_PLAYBACK_EVENTS_DSN)%'
                serializer: App\Playback\Infrastructure\Messaging\PlaybackEventSerializer
            # Outbound commands to the audio agent (task 016). Contract JSON with
            # the `command` discriminator in the body (ADR 002).
            agent_commands:
                dsn: '%env(MESSENGER_AGENT_COMMANDS_DSN)%'
                serializer: App\Playback\Infrastructure\Messaging\AgentCommandSerializer
            # Inbound status events from the audio agent, discriminated by `event`.
            agent_events:
                dsn: '%env(MESSENGER_AGENT_EVENTS_DSN)%'
                serializer: App\Playback\Infrastructure\Messaging\AgentEventSerializer
                retry_strategy:
                    max_retries: 3
                    delay: 1000
            # Internal delayed self-wake for repeatable jobs (task 020). Native PHP
            # serializer — producer and consumer are this service. DelayStamp drives
            # the per-tick interval; no cron. The AMQP transport realises the delay
            # via its own delay exchange.
            scheduler:
                dsn: '%env(MESSENGER_SCHEDULER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 3
                    delay: 1000

        routing:
            # Every outbound integration event travels to core; commands stay local.
            App\Playback\Application\IntegrationEvent\AnnouncementPlaybackEvent: playback_events
            App\Playback\Application\Agent\PlayAudioSequence: agent_commands
            App\Playback\Application\Agent\StopAudioPlayback: agent_commands
            App\Playback\Application\WakeScheduledPlaybackJob: scheduler

when@test:
    framework:
        messenger:
            transports:
                async: 'in-memory://'
                # Keep the outbound transports in-memory in tests so publishing can
                # be asserted without a running RabbitMQ.
                playback_events: 'in-memory://'
                agent_commands: 'in-memory://'
                agent_events: 'in-memory://'
                # In-memory ignores the delay but still queues the wake, so its
                # planning can be asserted without a broker.
                scheduler: 'in-memory://'
